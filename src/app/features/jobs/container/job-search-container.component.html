<div class="page-shell">
  <main class="container">
    <app-search-form
      [isSearching]="isLoading()"
      (searchSubmitted)="handleSearch($event)"
    />

    <app-results-display
      [jobs]="jobs()"
      [isLoading]="isLoading()"
      [errorMessage]="errorMessage()"
      [hasSearched]="hasSearched()"
    />
  </main>
  <footer class="site-footer">
    <span class="footer-brand">Remote Job Finder</span>
    <span class="footer-credit">Job listings sourced from <a href="https://remotive.com/remote-jobs" target="_blank" rel="noopener noreferrer">Remotive</a></span>
  </footer>
</div>
